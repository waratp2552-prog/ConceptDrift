<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConceptDrift — ระบบวิเคราะห์มโนทัศน์คลาดเคลื่อนในชั้นเรียน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
      background-color: #F6F8F7;
      color: #0F172A;
    }
    .dot-canvas {
      background-image: radial-gradient(#CBD5E1 1.25px, transparent 1.25px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CLASS_THEMES = [
      { id: 'emerald', name: 'เขียวหยก', hex: '#15803D', bg: 'bg-[#15803D]' },
      { id: 'blue', name: 'น้ำเงินคราม', hex: '#1D4ED8', bg: 'bg-[#1D4ED8]' },
      { id: 'indigo', name: 'ม่วงอินดิโก', hex: '#4F46E5', bg: 'bg-[#4F46E5]' },
      { id: 'teal', name: 'เขียวน้ำทะเล', hex: '#0F766E', bg: 'bg-[#0F766E]' },
      { id: 'amber', name: 'ส้มอิฐ', hex: '#B45309', bg: 'bg-[#B45309]' },
    ];

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function App() {
      // Navigation: 'auth' | 'hub' | 'class_detail' | 'student_join'
      const [screen, setScreen] = useState('auth');
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register' | 'quick_join'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [quickJoinCode, setQuickJoinCode] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');
      const [userProfile, setUserProfile] = useState(null);
      const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('cd_gemini_key') || '');
      const [showApiModal, setShowApiModal] = useState(false);

      // Classrooms State (Empty by default as requested)
      const [classrooms, setClassrooms] = useState(() => {
        try {
          const saved = localStorage.getItem('conceptdrift_clean_v3');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [activeClassId, setActiveClassId] = useState(null);
      const [classSubTab, setClassSubTab] = useState('materials'); // 'materials' | 'exit_setup' | 'radar' | 'student' | 'report'
      const [drawerOpen, setDrawerOpen] = useState(false);

      // Create Class Modal (Strictly only Class Name + Theme Color + Create button)
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [joinModalOpen, setJoinModalOpen] = useState(false);
      const [newClassName, setNewClassName] = useState('');
      const [newClassTheme, setNewClassTheme] = useState('emerald');

      // Material Upload State
      const [materialTitle, setMaterialTitle] = useState('');
      const [materialSummary, setMaterialSummary] = useState('');
      const [selectedFile, setSelectedFile] = useState(null);
      const fileCacheRef = useRef({});

      // Exit Ticket Setup State (Select Material + Page Range ex. 1-9)
      const [selectedMaterialId, setSelectedMaterialId] = useState('');
      const [pageRange, setPageRange] = useState('');
      const [draftQuestion, setDraftQuestion] = useState('');
      const [draftGoldenConcept, setDraftGoldenConcept] = useState('');
      const [draftClusters, setDraftClusters] = useState([]);
      const [aiGenerating, setAiGenerating] = useState(false);
      const [statusToast, setStatusToast] = useState('');

      // Student Submit State
      const [studentName, setStudentName] = useState('');
      const [studentAnswer, setStudentAnswer] = useState('');
      const [studentConfidence, setStudentConfidence] = useState(4);
      const [submittingAnswer, setSubmittingAnswer] = useState(false);
      const [selectedClusterId, setSelectedClusterId] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('conceptdrift_clean_v3', JSON.stringify(classrooms));
        } catch (e) {}
      }, [classrooms]);

      const activeClassroom = classrooms.find((c) => c.id === activeClassId) || null;

      const showToast = (msg) => {
        setStatusToast(msg);
        setTimeout(() => setStatusToast(''), 3500);
      };

      // 1. Auth Handler
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');

        if (authTab === 'quick_join') {
          const code = quickJoinCode.trim().toUpperCase();
          if (!code) {
            setAuthError('กรุณากรอกรหัสห้องเรียน 6 หลัก');
            return;
          }
          const found = classrooms.find((c) => c.roomCode.toUpperCase() === code);
          if (!found) {
            setAuthError('ไม่พบรหัสชั้นเรียนนี้ กรุณาให้คุณครูสร้างชั้นเรียนก่อน');
            return;
          }
          setActiveClassId(found.id);
          setScreen('student_join');
          return;
        }

        if (!email.trim() || !password.trim()) {
          setAuthError('กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน');
          return;
        }

        const displayName = authTab === 'register' && fullName.trim() ? fullName.trim() : email.split('@')[0];
        setUserProfile({ name: displayName, email: email.trim() });
        setScreen('hub');
      };

      const handleGoogleLogin = () => {
        setAuthError('');
        setUserProfile({ name: email ? email.split('@')[0] : 'คุณครูผู้สอน', email: email || 'teacher@school.ac.th' });
        setScreen('hub');
      };

      // 2. Create Classroom (Strictly cleaned as pointed out in red arrows)
      const handleCreateClassroom = (e) => {
        e.preventDefault();
        if (!newClassName.trim()) return;

        const newRoom = {
          id: 'cls-' + Date.now(),
          roomCode: generateRoomCode(),
          title: newClassName.trim(),
          teacher: userProfile?.name || 'คุณครูผู้สอน',
          theme: newClassTheme,
          materials: [],
          exitTicket: null,
          clusters: [],
          responses: [],
        };

        setClassrooms((prev) => [newRoom, ...prev]);
        setActiveClassId(newRoom.id);
        setClassSubTab('materials');
        setNewClassName('');
        setCreateModalOpen(false);
        setScreen('class_detail');
        showToast('สร้างชั้นเรียนเรียบร้อยแล้ว กรุณาอัปโหลดสื่อการสอน');
      };

      // 3. Upload Teaching Material
      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setSelectedFile(file);
        if (!materialTitle.trim()) {
          setMaterialTitle(file.name.replace(/\.[^/.]+$/, ''));
        }
      };

      const handleUploadMaterial = (e) => {
        e.preventDefault();
        if (!activeClassroom) return;
        if (!materialTitle.trim() && !selectedFile) return;

        const matId = 'mat-' + Date.now();
        const fileName = selectedFile ? selectedFile.name : 'เอกสารสรุปเนื้อหา.pdf';
        const fileSizeKB = selectedFile ? Math.max(1, Math.round(selectedFile.size / 1024)) : 120;
        const mimeType = selectedFile ? selectedFile.type || 'application/pdf' : 'text/plain';

        const saveMaterialRecord = (base64Data) => {
          if (base64Data) {
            fileCacheRef.current[matId] = { base64: base64Data, mimeType };
          }
          const newMat = {
            id: matId,
            title: materialTitle.trim() || fileName,
            fileName,
            fileSizeKB,
            mimeType,
            summaryText: materialSummary.trim(),
            uploadedAt: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
          };

          setClassrooms((prev) =>
            prev.map((cls) =>
              cls.id === activeClassroom.id
                ? { ...cls, materials: [newMat, ...(cls.materials || [])] }
                : cls
            )
          );
          setSelectedMaterialId(matId);
          setMaterialTitle('');
          setMaterialSummary('');
          setSelectedFile(null);
          showToast('อัปโหลดสื่อการสอนเรียบร้อยแล้ว');
        };

        if (selectedFile && selectedFile.size <= 4 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = () => {
            const result = typeof reader.result === 'string' ? reader.result.split(',')[1] : null;
            saveMaterialRecord(result);
          };
          reader.onerror = () => saveMaterialRecord(null);
          reader.readAsDataURL(selectedFile);
        } else {
          saveMaterialRecord(null);
        }
      };

      // 4. AI Generate Exit Ticket from Selected Material + Page Range (ex. 1-9)
      const handleGenerateExitTicketWithAI = async () => {
        if (!activeClassroom) return;
        const mat = (activeClassroom.materials || []).find((m) => m.id === selectedMaterialId);
        if (!mat) {
          showToast('กรุณาเลือกสื่อการสอนก่อน');
          return;
        }
        const pages = pageRange.trim() || '1-9';
        setAiGenerating(true);

        try {
          if (geminiApiKey.trim()) {
            const parts = [];
            const cached = fileCacheRef.current[mat.id];
            if (cached?.base64 && (cached.mimeType.includes('pdf') || cached.mimeType.includes('image'))) {
              parts.push({
                inlineData: {
                  mimeType: cached.mimeType,
                  data: cached.base64,
                },
              });
            }

            parts.push({
              text: `คุณคือผู้เชี่ยวชาญการวัดผลทางการศึกษาของคณะครุศาสตร์
ชื่อชั้นเรียน: "${activeClassroom.title}"
สื่อการสอนที่ใช้: "${mat.title}" (${mat.fileName})
รายละเอียดสื่อเพิ่มเติม: "${mat.summaryText || 'วิเคราะห์ตามหัวข้อวิชาและไฟล์แนบ'}"
วันนี้ครูสอนถึงหน้า: "${pages}"

จงออกแบบคำถาม Exit Ticket ท้ายคาบ 1 ข้อจากเนื้อหาในหน้า ${pages} เพื่อสแกนหามโนทัศน์ที่คลาดเคลื่อน (Misconception) ของนักเรียน พร้อมเฉลยแกนหลัก (Golden Concept) และกลุ่มคำตอบจำลอง 3 กลุ่ม (ALIGNED, PARTIAL, DRIFTED) ตอบกลับเป็น JSON เท่านั้น:
{
  "question": "คำถามท้ายคาบ...",
  "goldenConcept": "แนวคิดที่ถูกต้อง...",
  "clusters": [
    {
      "id": "c-aligned",
      "label": "สรุปกลุ่มที่เข้าใจถูกต้อง",
      "status": "ALIGNED",
      "count": 18,
      "avgConfidence": 4.4,
      "x": 0.78,
      "y": 0.78,
      "rootCause": "เข้าใจหลักการในหน้า ${pages} ได้ถูกต้อง",
      "remediation": "ชมเชยและให้ช่วยอธิบายเพื่อน",
      "samples": ["คำตอบตัวอย่างที่ถูก"]
    },
    {
      "id": "c-partial",
      "label": "สรุปกลุ่มที่เข้าใจบางส่วน",
      "status": "PARTIAL",
      "count": 10,
      "avgConfidence": 3.2,
      "x": 0.50,
      "y": 0.55,
      "rootCause": "จำเนื้อหาในหน้า ${pages} ได้แต่ระบุเงื่อนไขไม่ครบ",
      "remediation": "ทบทวนตัวอย่างในสไลด์หน้า ${pages}",
      "samples": ["คำตอบที่ถูกครึ่งเดียว"]
    },
    {
      "id": "c-drifted",
      "label": "สรุปกลุ่มที่เข้าใจคลาดเคลื่อน",
      "status": "DRIFTED",
      "count": 12,
      "avgConfidence": 4.6,
      "x": 0.22,
      "y": 0.85,
      "rootCause": "สับสนนิยามหลักในหน้า ${pages}",
      "remediation": "ยกตัวอย่างเปรียบเทียบให้เห็นภาพชัดหน้าห้อง",
      "samples": ["คำตอบที่เข้าใจผิดแต่คิดว่าถูก"]
    }
  ]
}`,
            });

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { responseMimeType: 'application/json' },
                }),
              }
            );
            const data = await res.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              const parsed = JSON.parse(rawText);
              setDraftQuestion(parsed.question);
              setDraftGoldenConcept(parsed.goldenConcept);
              setDraftClusters(parsed.clusters || []);
              setAiGenerating(false);
              showToast(`AI วิเคราะห์สื่อหน้า ${pages} และคิดคำถามสำเร็จ!`);
              return;
            }
          }

          // Smart Fallback Generator (works offline / without API key immediately)
          await new Promise((r) => setTimeout(r, 900));
          const topicName = mat.title || activeClassroom.title;
          const summaryContext = mat.summaryText ? ` (${mat.summaryText.slice(0, 60)})` : '';
          setDraftQuestion(
            `จากสื่อการสอนเรื่อง "${topicName}" ในหน้า ${pages}${summaryContext} จงอธิบายหลักการสำคัญและเหตุผลว่าทำไมผลลัพธ์จึงเป็นเช่นนั้นด้วยภาษาของตนเอง (1-2 ประโยค)`
          );
          setDraftGoldenConcept(
            `เข้าใจความสัมพันธ์ของตัวแปรและเงื่อนไขหลักที่ระบุในสื่อการสอน "${topicName}" หน้า ${pages} ได้อย่างถูกต้องโดยไม่สับสนระหว่างสาเหตุและผลลัพธ์`
          );
          setDraftClusters([
            {
              id: 'c-aligned-' + Date.now(),
              label: `อธิบายหลักการในหน้า ${pages} และเชื่อมโยงเหตุผลได้ถูกต้อง`,
              status: 'ALIGNED',
              count: 18,
              avgConfidence: 4.4,
              x: 0.78,
              y: 0.78,
              rootCause: `เข้าใจแก่นเนื้อหาจากสื่อ "${topicName}" หน้า ${pages} ครบถ้วน`,
              remediation: 'ใช้คำตอบของกลุ่มนี้เป็นตัวอย่างต้นแบบในการสรุปปิดคาบเรียน',
              samples: [`เพราะเป็นไปตามเงื่อนไขหลักในหน้า ${pages} ที่กำหนดไว้อย่างชัดเจนครับ`],
            },
            {
              id: 'c-partial-' + Date.now(),
              label: `จำคำสำคัญในหน้า ${pages} ได้ แต่ยังอธิบายเหตุผลไม่ครบ`,
              status: 'PARTIAL',
              count: 9,
              avgConfidence: 3.3,
              x: 0.52,
              y: 0.56,
              rootCause: `ท่องจำนิยามจากสื่อหน้า ${pages} ได้แต่ข้ามเงื่อนไขสำคัญไป`,
              remediation: `เปิดสไลด์/เอกสารหน้า ${pages} ชี้จุดที่เป็นเงื่อนไขบังคับให้นักเรียนดูอีกครั้ง`,
              samples: ['เกิดจากตัวแปรตั้งต้นเปลี่ยนไปครับ แต่จำไม่ได้ว่าต้องควบคุมตัวแปรใดบ้าง'],
            },
            {
              id: 'c-drifted-' + Date.now(),
              label: `เข้าใจคลาดเคลื่อนโดยจำสลับความสัมพันธ์ในหน้า ${pages}`,
              status: 'DRIFTED',
              count: 13,
              avgConfidence: 4.6,
              x: 0.22,
              y: 0.85,
              rootCause: `เกิดมโนทัศน์คลาดเคลื่อน (Misconception) จากการตีความกราฟ/ตัวอย่างในหน้า ${pages} สลับทิศทางกัน`,
              remediation: `ตั้งคำถามกระตุ้นคิดเปรียบเทียบกรณีสุดโต่ง เพื่อให้เด็กเห็นความขัดแย้งในคำตอบของตนเอง`,
              samples: [`ไม่มีผลเปลี่ยนแปลงครับ เพราะค่าในหน้า ${pages} หักล้างกันเป็นศูนย์พอดี`],
            },
          ]);
          showToast(`วิเคราะห์สื่อ "${topicName}" หน้า ${pages} สำเร็จ!`);
        } catch (err) {
          console.error(err);
          showToast('เกิดข้อผิดพลาดในการสร้างคำถาม');
        } finally {
          setAiGenerating(false);
        }
      };

      const handleActivateExitTicket = () => {
        if (!activeClassroom || !draftQuestion.trim() || !draftGoldenConcept.trim()) return;
        const mat = (activeClassroom.materials || []).find((m) => m.id === selectedMaterialId);

        const ticketObj = {
          materialId: selectedMaterialId,
          materialTitle: mat ? mat.title : 'สื่อการสอนประจำคาบ',
          pageRange: pageRange.trim() || '1-9',
          question: draftQuestion.trim(),
          goldenConcept: draftGoldenConcept.trim(),
          updatedAt: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
        };

        setClassrooms((prev) =>
          prev.map((cls) =>
            cls.id === activeClassroom.id
              ? {
                  ...cls,
                  exitTicket: ticketObj,
                  clusters: cls.clusters?.length ? cls.clusters : [],
                }
              : cls
          )
        );
        setClassSubTab('radar');
        showToast('เปิดใช้งาน Exit Ticket ประจำคาบเรียบร้อยแล้ว!');
      };

      const handleLoadSimulatedResponses = () => {
        if (!activeClassroom) return;
        const clustersToUse =
          draftClusters.length > 0
            ? draftClusters
            : [
                {
                  id: 'c-1',
                  label: 'เข้าใจแนวคิดหลักตามสื่อการสอนถูกต้อง',
                  status: 'ALIGNED',
                  count: 19,
                  avgConfidence: 4.4,
                  x: 0.78,
                  y: 0.78,
                  rootCause: 'แยกแยะความสัมพันธ์ของเนื้อหาในหน้าที่เรียนได้แม่นยำ',
                  remediation: 'ชมเชยและให้ตัวแทนกลุ่มสรุปให้เพื่อนฟัง',
                  samples: ['อธิบายตามหลักการในเอกสารหน้าที่เรียนวันนี้ได้ครบถ้วนครับ'],
                },
                {
                  id: 'c-2',
                  label: 'เข้าใจถูกบางส่วนแต่ตกหล่นเงื่อนไขสำคัญ',
                  status: 'PARTIAL',
                  count: 9,
                  avgConfidence: 3.2,
                  x: 0.50,
                  y: 0.55,
                  rootCause: 'จำเฉพาะสูตรหรือข้อสรุปสั้นๆ โดยไม่ดูบริบท',
                  remediation: 'ทบทวนเงื่อนไขเพิ่มเติมจากสื่อการสอน',
                  samples: ['ตอบถูกครึ่งแรกแต่ลืมระบุเงื่อนไขกำกับ'],
                },
                {
                  id: 'c-3',
                  label: 'เข้าใจคลาดเคลื่อน (จำสลับหลักการสำคัญ)',
                  status: 'DRIFTED',
                  count: 12,
                  avgConfidence: 4.6,
                  x: 0.22,
                  y: 0.86,
                  rootCause: 'ยึดติดความเข้าใจเดิมและตีความเนื้อหาในสื่อผิดทิศทาง',
                  remediation: 'ยกตัวอย่างเปรียบเทียบหน้าห้องเพื่อคลายความเข้าใจผิดทันที',
                  samples: ['เข้าใจว่าค่าทั้งสองแปรผันตรงกันเสมอในทุกกรณีครับ'],
                },
              ];

        setClassrooms((prev) =>
          prev.map((cls) =>
            cls.id === activeClassroom.id ? { ...cls, clusters: clustersToUse } : cls
          )
        );
        setSelectedClusterId(clustersToUse[0].id);

                {[
                  { id: 'materials', label: '1. อัปโหลดสื่อการสอน' },
                  { id: 'exit_setup', label: '2. สร้าง Exit Ticket (เลือกหน้า)' },
                  { id: 'radar', label: '3. เรดาร์กลุ่มความคิด' },
                  { id: 'student', label: '4. หน้าจอนักเรียน' },
                  { id: 'report', label: '5. รายงาน ว.PA' },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setClassSubTab(t.id)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition ${
                      classSubTab === t.id ? 'bg-[#15803D] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </div>
            </header>

            <main className="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-1 space-y-5">
              {/* TAB 1: UPLOAD TEACHING MATERIALS */}
              {classSubTab === 'materials' && (
                <div className="space-y-5">
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                    <h2 className="text-lg font-extrabold text-slate-900 mb-1">อัปโหลดสื่อการสอนประจำวิชา</h2>
                    <p className="text-xs text-slate-500 mb-5">
                      อัปโหลดไฟล์สไลด์ PDF, เอกสารประกอบการสอน หรือรูปภาพ เพื่อให้ AI นำไปใช้ออกคำถาม Exit Ticket ตามเลขหน้าที่สอนในแต่ละวัน
                    </p>
                    <form onSubmit={handleUploadMaterial} className="space-y-4">
                      <div>
                        <label className="block text-sm font-bold text-slate-800 mb-1.5">เลือกไฟล์สื่อการสอน (PDF / รูปภาพ / เอกสาร)</label>
                        <input
                          type="file"
                          accept=".pdf,image/*,.txt,.doc,.docx,.ppt,.pptx"
                          onChange={handleFileSelect}
                          className="w-full text-sm text-slate-600 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-[#15803D] hover:file:bg-emerald-100"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-slate-800 mb-1.5">ชื่อสื่อการสอน / บทเรียน *</label>
                        <input
                          type="text"
                          required
                          value={materialTitle}
                          onChange={(e) => setMaterialTitle(e.target.value)}
                          placeholder="เช่น บทที่ 1 แรงและการเคลื่อนที่ (สไลด์หน้า 1-30)"
                          className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-slate-800 mb-1.5">
                          รายละเอียดเนื้อหาโดยย่อ (ระบุเพื่อให้ AI แม่นยำขึ้น หรือเว้นว่างได้)
                        </label>
                        <textarea
                          rows={2}
                          value={materialSummary}
                          onChange={(e) => setMaterialSummary(e.target.value)}
                          placeholder="เช่น หน้า 1-9 เป็นเรื่องกฎข้อที่ 1 ของนิวตัน การเคลื่อนที่ในแนวดิ่ง และแรงลัพธ์ที่จุดสูงสุด"
                          className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                        />
                      </div>
                      <button
                        type="submit"
                        className="px-6 py-3 rounded-full bg-[#15803D] hover:bg-[#166534] text-white font-bold text-sm"
                      >
                        + บันทึกสื่อการสอนเข้าชั้นเรียน
                      </button>
                    </form>
                  </div>

                  {/* Uploaded Materials List */}
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                    <h3 className="text-base font-extrabold text-slate-900 mb-3">
                      คลังสื่อการสอนในชั้นเรียนนี้ ({(activeClassroom.materials || []).length})
                    </h3>
                    {(activeClassroom.materials || []).length === 0 ? (
                      <p className="text-sm text-slate-400 py-6 text-center">ยังไม่มีสื่อการสอนที่อัปโหลด</p>
                    ) : (
                      <div className="space-y-3">
                        {(activeClassroom.materials || []).map((m) => (
                          <div
                            key={m.id}
                            className="p-4 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3"
                          >
                            <div>
                              <div className="font-bold text-sm text-slate-900">📄 {m.title}</div>
                              <div className="text-xs text-slate-500 mt-0.5">
                                ไฟล์: {m.fileName} ({m.fileSizeKB} KB) • อัปโหลดเมื่อ {m.uploadedAt}
                              </div>
                            </div>
                            <button
                              onClick={() => {
                                setSelectedMaterialId(m.id);
                                setClassSubTab('exit_setup');
                              }}
                              className="px-4 py-2 rounded-full bg-emerald-50 text-[#15803D] font-bold text-xs hover:bg-emerald-100"
                            >
                              เลือกสื่อนี้ไปสร้าง Exit Ticket →
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 2: EXIT TICKET BY MATERIAL + PAGE RANGE (ex. 1-9) */}
              {classSubTab === 'exit_setup' && (
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-5">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900">สร้าง Exit Ticket จากสื่อการสอนและเลขหน้าที่สอน</h2>
                    <p className="text-xs text-slate-500 mt-1">
                      เลือกสื่อการสอนที่อัปโหลดไว้ และระบุว่าวันนี้สอนหน้าไหนไป (เช่น 1-9) เพื่อให้ AI อ่านสื่อและคิดคำถามวัดความเข้าใจออกมาให้ทันที
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">1. เลือกสื่อการสอนที่อัปโหลดไว้ *</label>
                      <select
                        value={selectedMaterialId}
                        onChange={(e) => setSelectedMaterialId(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm bg-white"
                      >
                        <option value="">-- เลือกไฟล์สื่อการสอน --</option>
                        {(activeClassroom.materials || []).map((m) => (
                          <option key={m.id} value={m.id}>
                            {m.title} ({m.fileName})
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">2. วันนี้สอนหน้าไหนไป? (เช่น 1-9) *</label>
                      <input
                        type="text"
                        value={pageRange}
                        onChange={(e) => setPageRange(e.target.value)}
                        placeholder="ex. 1-9 หรือ 10-15"
                        className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                      />
                    </div>
                  </div>

                  <button
                    type="button"
                    disabled={aiGenerating}
                    onClick={handleGenerateExitTicketWithAI}
                    className="w-full py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition"
                  >
                    {aiGenerating
                      ? '⏳ AI กำลังอ่านสื่อการสอนและคิดคำถาม...'
                      : '✨ ให้ AI ดูสื่อการสอนตามเลขหน้าและคิดคำถาม Exit Ticket'}
                  </button>

                  {draftQuestion && (
                    <div className="pt-4 border-t border-slate-200 space-y-4">
                      <div>
                        <label className="block text-sm font-bold text-slate-800 mb-1.5">
                          คำถาม Exit Ticket ที่ AI สร้างให้ (แก้ไขได้)
                        </label>
                        <textarea
                          rows={2}
                          value={draftQuestion}
                          onChange={(e) => setDraftQuestion(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-slate-800 mb-1.5">
                          แนวคิดแกนหลักที่ถูกต้อง / เฉลย (Golden Concept)
                        </label>
                        <textarea
                          rows={2}
                          value={draftGoldenConcept}
                          onChange={(e) => setDraftGoldenConcept(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl border border-emerald-300 bg-emerald-50/40 text-sm"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={handleActivateExitTicket}
                        className="w-full py-3.5 rounded-full bg-[#15803D] hover:bg-[#166534] text-white font-bold text-sm"
                      >
                        🚀 เปิดใช้งาน Exit Ticket นี้และไปยังเรดาร์วิเคราะห์สด
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 3: RADAR */}
              {classSubTab === 'radar' && (
                <div className="space-y-5">
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                      <div>
                        <span className="text-xs font-bold text-[#15803D] bg-emerald-50 px-3 py-1 rounded-full">
                          สื่อ: {activeClassroom.exitTicket?.materialTitle || 'ยังไม่ได้เลือก'} • หน้า {activeClassroom.exitTicket?.pageRange || '-'}
                        </span>
                        <h2 className="text-base font-extrabold text-slate-900 mt-2">
                          {activeClassroom.exitTicket?.question || 'กรุณาตั้งค่า Exit Ticket ในแท็บที่ 2 ก่อน'}
                        </h2>
                      </div>
                      <button
                        onClick={handleLoadSimulatedResponses}
                        className="px-4 py-2.5 rounded-full bg-[#15803D] text-white text-xs font-bold shrink-0"
                      >
                        ⚡ จำลองนักเรียนส่งคำตอบ 40 คน
                      </button>
                    </div>

                    {/* 2D Vector Space Bubble Canvas */}
                    <div className="relative h-[340px] rounded-2xl border border-slate-200 dot-canvas overflow-hidden flex items-center justify-center">
                      <div className="absolute top-3 left-4 text-[11px] font-bold text-slate-500">
                        ← เข้าใจคลาดเคลื่อน (Drifted) | เข้าใจตรงประเด็น (Aligned) →
                      </div>
                      {(activeClassroom.clusters || []).length === 0 ? (
                        <div className="text-center text-sm text-slate-400">
                          ยังไม่มีคำตอบส่งเข้ามา กดปุ่ม "จำลองนักเรียนส่งคำตอบ 40 คน" ด้านบน หรือพิมพ์ส่งจากแท็บที่ 4
                        </div>
                      ) : (
                        (activeClassroom.clusters || []).map((c) => {
                          const size = Math.min(165, Math.max(85, 65 + c.count * 4));
                          const color =
                            c.status === 'ALIGNED'
                              ? 'bg-emerald-500/90 border-emerald-700 text-white'
                              : c.status === 'PARTIAL'
                              ? 'bg-amber-500/90 border-amber-700 text-white'
                              : 'bg-rose-600/90 border-rose-800 text-white ring-4 ring-rose-300';
                          return (
                            <button
                              key={c.id}
                              onClick={() => setSelectedClusterId(c.id)}
                              style={{
                                width: `${size}px`,
                                height: `${size}px`,
                                left: `${c.x * 100}%`,
                                top: `${(1 - c.y) * 100}%`,
                                transform: 'translate(-50%, -50%)',
                              }}
                              className={`absolute rounded-full border-2 p-2.5 flex flex-col items-center justify-center text-center shadow-md transition hover:scale-105 ${color}`}
                            >
                              <span className="text-base font-extrabold">{c.count} คน</span>
                              <span className="text-[10px] leading-tight line-clamp-2 mt-0.5">{c.label}</span>
                            </button>
                          );
                        })
                      )}
                    </div>
                  </div>

                  {selectedCluster && (
                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                      <div className="text-xs font-bold text-slate-400 uppercase">ผลการวินิจฉัยกลุ่มความคิดที่เลือก</div>
                      <h3 className="text-base font-extrabold text-slate-900">
                        {selectedCluster.label} ({selectedCluster.count} คน • ความมั่นใจเฉลี่ย {selectedCluster.avgConfidence}/5)
                      </h3>
                      <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                        <strong>สาเหตุทางความคิด (Root Cause):</strong> {selectedCluster.rootCause}
                      </div>
                      <div className="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900">
                        <strong>คำแนะนำการสอนซ่อมเสริมหน้าห้อง:</strong> {selectedCluster.remediation}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 4: STUDENT EXIT TICKET VIEW */}
              {classSubTab === 'student' && (
                <div className="bg-white rounded-3xl border border-slate-200 p-6 max-w-lg mx-auto shadow-sm space-y-4">
                  <div className="text-xs font-bold text-[#15803D]">
                    หน้าจอนักเรียน • ห้อง #{activeClassroom.roomCode} (หน้า {activeClassroom.exitTicket?.pageRange || '1-9'})
                  </div>
                  <h2 className="text-base font-extrabold text-slate-900">
                    {activeClassroom.exitTicket?.question || 'กรุณาให้ครูตั้งค่าคำถาม Exit Ticket ก่อน'}
                  </h2>
                  <form onSubmit={handleStudentSubmit} className="space-y-4">
                    <input
                      type="text"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      placeholder="ชื่อ-นามสกุล หรือเลขที่ (ไม่บังคับ)"
                      className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                    />
                    <textarea
                      rows={3}
                      required
                      value={studentAnswer}
                      onChange={(e) => setStudentAnswer(e.target.value)}
                      placeholder="พิมพ์อธิบายความเข้าใจของคุณ 1-2 ประโยค..."
                      className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm"
                    />
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        ระดับความมั่นใจในคำตอบ: {studentConfidence} / 5
                      </label>
                      <input
                        type="range"
                        min={1}
                        max={5}
                        value={studentConfidence}
                        onChange={(e) => setStudentConfidence(Number(e.target.value))}
                        className="w-full accent-[#15803D]"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={submittingAnswer}
                      className="w-full py-3.5 rounded-full bg-[#15803D] text-white font-bold text-sm"
                    >
                      🚀 ส่งคำตอบเข้าเรดาร์
                    </button>
                  </form>
                </div>
              )}

              {/* TAB 5: PLC / ว.PA REPORT */}
              {classSubTab === 'report' && (
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-extrabold text-slate-900">รายงานวิจัยในชั้นเรียน (PLC / ว.PA)</h2>
                      <p className="text-xs text-slate-500">
                        สรุปข้อมูลมโนทัศน์ที่คลาดเคลื่อนจากสื่อการสอน "{activeClassroom.exitTicket?.materialTitle || '-'}" หน้า {activeClassroom.exitTicket?.pageRange || '-'}
                      </p>
                    </div>
                    <button
                      onClick={exportCSV}
                      className="px-4 py-2.5 rounded-full bg-[#15803D] text-white text-xs font-bold"
                    >
                      📥 ดาวน์โหลดไฟล์ CSV (Excel)
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      // Student Direct Join View
      return (
        <div className="min-h-screen bg-[#F6F8F7] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl border border-slate-200 p-6 max-w-md w-full space-y-4">
            <button onClick={() => setScreen('auth')} className="text-xs font-bold text-slate-500">
              ← กลับหน้าหลัก
            </button>
            <h2 className="text-lg font-extrabold text-slate-900">
              ห้องเรียน: {activeClassroom?.title || 'ConceptDrift'}
            </h2>
            <p className="text-sm text-slate-700">
              {activeClassroom?.exitTicket?.question || 'รอคุณครูเปิดคำถาม Exit Ticket ประจำคาบ'}
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
